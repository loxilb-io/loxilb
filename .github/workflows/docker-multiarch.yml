name: Docker-Multi-Arch

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'main.go'
      - 'api/**'
      - 'common/**'
      - 'options/**'
      - 'pkg/**'
      - 'loxilb-ebpf/**'
      - 'tools/**'
      - '.github/workflows/docker-multiarch.yml'
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Tag Name'
        required: true
        default: 'latest'
      sourceTag:
        description: 'Source git ref used inside Dockerfile builds; defaults to main unless overridden'
        required: false
        default: ''

env:
  IMAGE_NAME: ghcr.io/loxilb-io/loxilb
  TARGET_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tagName || 'latest' }}
  BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sourceTag != '' && github.event.inputs.sourceTag || (github.event_name == 'workflow_dispatch' && github.event.inputs.tagName != 'latest' && github.event.inputs.tagName || 'main') }}
  # Release version stamped into the binary. .dockerignore excludes .git, so the
  # in-container build cannot derive it from a tag and it has to be passed in.
  # Empty for 'latest' (a rolling build of main, which has no release version).
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tagName != 'latest' && github.event.inputs.tagName || '' }}

jobs:
  build-check-amd64:
    if: github.repository != 'loxilb-io/loxilb'
    runs-on: ubuntu-latest
    name: build check amd64
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build amd64 image
      run: |
        docker build \
          --progress=plain \
          --build-arg TAG=${BUILD_REF} \
          --tag ${IMAGE_NAME}:buildcheck-amd64 \
          .

  build-check-arm64:
    if: github.repository != 'loxilb-io/loxilb'
    runs-on: ubuntu-24.04-arm
    name: build check arm64
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build arm64 image
      run: |
        docker build \
          --progress=plain \
          --build-arg TAG=${BUILD_REF} \
          --build-arg USE_DOCKER_BUILDX_ARM64=false \
          --tag ${IMAGE_NAME}:buildcheck-arm64 \
          .

  build-amd64:
    if: github.repository == 'loxilb-io/loxilb'
    runs-on: ubuntu-latest
    name: build amd64 image
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Pushed by digest rather than under a `<tag>-amd64` tag. The per-arch build
    # is an implementation detail of the multi-arch tag that `merge-manifest`
    # assembles below; tagging it published that detail permanently, so every
    # release left two extra tags sitting in the package listing forever.
    - name: Build and push amd64 image by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        build-args: |
          TAG=${{ env.BUILD_REF }}
          VERSION=${{ env.RELEASE_VERSION }}
        outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=amd64
        cache-to: type=gha,mode=max,scope=amd64

    # The digest is handed to merge-manifest as an artifact -- job outputs would
    # work for two fixed arches, but this stays correct if a third is added.
    - name: Export the digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload the digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-amd64
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  build-arm64:
    if: github.repository == 'loxilb-io/loxilb'
    runs-on: ubuntu-24.04-arm
    name: build arm64 image
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # By digest, for the reason given on the amd64 job above.
    - name: Build and push arm64 image by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/arm64
        build-args: |
          TAG=${{ env.BUILD_REF }}
          VERSION=${{ env.RELEASE_VERSION }}
          USE_DOCKER_BUILDX_ARM64=false
        outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
        cache-from: type=gha,scope=arm64
        cache-to: type=gha,mode=max,scope=arm64

    - name: Export the digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"

    - name: Upload the digest
      uses: actions/upload-artifact@v4
      with:
        name: digests-arm64
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  merge-manifest:
    if: github.repository == 'loxilb-io/loxilb'
    runs-on: ubuntu-latest
    name: merge multi-arch manifest
    needs: [build-amd64, build-arm64]
    permissions:
      contents: read
      packages: write
    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Download the per-arch digests
      uses: actions/download-artifact@v4
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true

    # One file per arch, named after its digest, so the sources are assembled
    # from the directory listing rather than from a hardcoded arch list.
    - name: Create and push multi-arch manifest
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          --tag ${IMAGE_NAME}:${TARGET_TAG} \
          $(printf "${IMAGE_NAME}@sha256:%s " *)
        docker buildx imagetools inspect ${IMAGE_NAME}:${TARGET_TAG}
    
